name: deploy
on:
  workflow_call:
    inputs:
      environment:
        description: Environment to deploy
        type: string
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.environment == 'staging' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - name: Deploy the immutable release artifact to Pages staging
        id: pages
        uses: actions/deploy-pages@v4
